<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StriveX Gateway — Live Logs</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #26303b; --text: #c9d1d9;
    --muted: #7d8590; --accent: #58a6ff; --ok: #3fb950; --warn: #d29922; --err: #f85149;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; }
  .top { position: sticky; top: 0; z-index: 2; }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 18px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .simbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 8px 16px; background: #0f141b; border-bottom: 1px solid var(--border);
  }
  .simbar.hidden { display: none; }
  .sim-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; margin-right: 2px; }
  .simbar input {
    font-family: var(--mono); font-size: 12px; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; width: 130px;
  }
  .simbar input#sim-score { width: 80px; }
  .simbar button {
    font-family: var(--mono); font-size: 11px; color: var(--text); background: #21262d;
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  .simbar button:disabled { opacity: .4; cursor: not-allowed; }
  .sim-go { border-color: var(--accent); color: var(--accent); }
  .sim-ok:hover:not(:disabled) { border-color: var(--ok); color: var(--ok); }
  .sim-warn:hover:not(:disabled) { border-color: var(--warn); color: var(--warn); }
  .sim-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  .sim-msg { font-size: 11px; color: var(--muted); }
  .sim-msg.err { color: var(--err); }
  .sim-msg.ok { color: var(--ok); }
  .brand { font-weight: 700; color: var(--accent); letter-spacing: .3px; margin-right: 4px; }
  .stat { display: flex; flex-direction: column; line-height: 1.3; }
  .stat .k { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
  .stat .v { color: var(--text); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); vertical-align: middle; }
  .dot.live { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.busy { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
  .dot.down { background: var(--err); }
  .spacer { flex: 1; }
  .controls { display: flex; align-items: center; gap: 8px; }
  .controls label { color: var(--muted); font-size: 11px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  button {
    font-family: var(--mono); font-size: 11px; color: var(--text); background: #21262d;
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  #log { padding: 8px 0 40px; }
  .line { display: flex; gap: 10px; padding: 1px 16px; white-space: pre-wrap; word-break: break-word; }
  .line:hover { background: #12171e; }
  .line .ts { color: var(--muted); flex: 0 0 auto; }
  .line .lvl { flex: 0 0 46px; text-transform: uppercase; font-size: 10px; padding-top: 1px; }
  .line.log  .lvl { color: var(--muted); }
  .line.info .lvl { color: var(--accent); }
  .line.warn .lvl { color: var(--warn); }
  .line.warn .msg { color: var(--warn); }
  .line.error .lvl { color: var(--err); }
  .line.error .msg { color: var(--err); }
  .empty { color: var(--muted); padding: 24px 16px; }
</style>
</head>
<body>
  <div class="top">
  <header>
    <span class="brand">StriveX Gateway</span>
    <div class="stat"><span class="k">Connection</span><span class="v"><span id="conn-dot" class="dot"></span><span id="conn">connecting…</span></span></div>
    <div class="stat"><span class="k">Station</span><span class="v" id="station">—</span></div>
    <div class="stat"><span class="k">Adapter</span><span class="v" id="adapter">—</span></div>
    <div class="stat"><span class="k">Server</span><span class="v" id="server">—</span></div>
    <div class="stat"><span class="k">Current game</span><span class="v" id="current">—</span></div>
    <div class="stat"><span class="k">Pending</span><span class="v" id="pending">—</span></div>
    <div class="stat"><span class="k">Uptime</span><span class="v" id="uptime">—</span></div>
    <span class="spacer"></span>
    <div class="controls">
      <label><input type="checkbox" id="autoscroll" checked /> autoscroll</label>
      <button id="clear">clear</button>
    </div>
  </header>
  <div class="simbar hidden" id="sim">
    <span class="sim-label">Simulate</span>
    <input id="sim-uid" placeholder="bracelet UID" autocomplete="off" />
    <button id="sim-scan" class="sim-go">Scan bracelet</button>
    <span class="sim-sep"></span>
    <input id="sim-score" type="number" placeholder="score" autocomplete="off" />
    <button id="sim-complete" class="sim-ok">Complete</button>
    <button id="sim-fail" class="sim-warn">Fail</button>
    <button id="sim-timeout" class="sim-warn">Timeout</button>
    <span id="sim-msg" class="sim-msg"></span>
  </div>
  </div>
  <div id="log"><div class="empty">Waiting for gateway log output…</div></div>

<script>
  const logEl = document.getElementById('log');
  const autoscroll = document.getElementById('autoscroll');
  let cleared = false;

  function fmtTs(ms) {
    const d = new Date(ms);
    return d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0');
  }
  function fmtUptime(ms) {
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    return (h ? h + 'h ' : '') + (h || m ? m + 'm ' : '') + ss + 's';
  }

  function append(entry) {
    if (!cleared) { logEl.innerHTML = ''; cleared = true; }
    const line = document.createElement('div');
    line.className = 'line ' + (entry.level || 'log');
    const ts = document.createElement('span'); ts.className = 'ts'; ts.textContent = fmtTs(entry.ts);
    const lvl = document.createElement('span'); lvl.className = 'lvl'; lvl.textContent = entry.level;
    const msg = document.createElement('span'); msg.className = 'msg'; msg.textContent = entry.msg;
    line.append(ts, lvl, msg);
    logEl.appendChild(line);
    if (autoscroll.checked) window.scrollTo(0, document.body.scrollHeight);
  }

  document.getElementById('clear').addEventListener('click', () => { logEl.innerHTML = ''; });

  // --- live log stream (SSE) ---
  const connDot = document.getElementById('conn-dot');
  const conn = document.getElementById('conn');
  function connect() {
    const es = new EventSource('/events');
    es.onopen = () => { conn.textContent = 'live'; connDot.className = 'dot live'; };
    es.onmessage = (e) => { try { append(JSON.parse(e.data)); } catch {} };
    es.onerror = () => { conn.textContent = 'reconnecting…'; connDot.className = 'dot down'; };
  }
  connect();

  // --- status header (poll) ---
  async function pollStatus() {
    try {
      const s = await (await fetch('/status')).json();
      document.getElementById('station').textContent = s.station ?? '—';
      document.getElementById('adapter').textContent = s.adapter ?? '—';
      document.getElementById('server').textContent = s.server ?? '—';
      document.getElementById('pending').textContent = s.pending ?? '—';
      document.getElementById('uptime').textContent = s.uptime_ms != null ? fmtUptime(s.uptime_ms) : '—';
      const cur = document.getElementById('current');
      if (s.current) { cur.innerHTML = '<span class="dot busy"></span>' + s.current; }
      else { cur.innerHTML = '<span class="dot live"></span>idle'; }
      syncSim(s);
    } catch { /* gateway momentarily unreachable; keep last values */ }
  }
  pollStatus();
  setInterval(pollStatus, 2000);

  // --- Simulate panel ---
  const sim = document.getElementById('sim');
  const simMsg = document.getElementById('sim-msg');
  const resultBtns = ['sim-complete', 'sim-fail', 'sim-timeout'].map((id) => document.getElementById(id));

  function syncSim(s) {
    sim.classList.toggle('hidden', !s.simEnabled);         // hidden on serial (real hardware)
    const inGame = !!s.current;
    resultBtns.forEach((b) => { b.disabled = !inGame; });  // outcome only makes sense mid-game
    document.getElementById('sim-scan').disabled = inGame;  // one game at a time
  }
  function simFlash(msg, ok = true) {
    simMsg.textContent = msg; simMsg.className = 'sim-msg ' + (ok ? 'ok' : 'err');
  }
  async function post(path, body) {
    const res = await fetch(path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  document.getElementById('sim-scan').addEventListener('click', async () => {
    const uid = document.getElementById('sim-uid').value.trim();
    if (!uid) { simFlash('enter a bracelet UID', false); return; }
    try { await post('/sim/tap', { uid }); simFlash(`tapped ${uid}`); pollStatus(); }
    catch (e) { simFlash(e.message, false); }
  });
  document.getElementById('sim-complete').addEventListener('click', async () => {
    const raw = document.getElementById('sim-score').value.trim();
    const value = raw === '' ? null : Number(raw);
    try { await post('/sim/result', { status: 'completed', value }); simFlash('completed'); pollStatus(); }
    catch (e) { simFlash(e.message, false); }
  });
  document.getElementById('sim-fail').addEventListener('click', async () => {
    try { await post('/sim/result', { status: 'failed' }); simFlash('failed'); pollStatus(); }
    catch (e) { simFlash(e.message, false); }
  });
  document.getElementById('sim-timeout').addEventListener('click', async () => {
    try { await post('/sim/result', { status: 'timeout' }); simFlash('timeout'); pollStatus(); }
    catch (e) { simFlash(e.message, false); }
  });
</script>
</body>
</html>
